<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#010409"/>
  
  <!-- Outer glow ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#00f5ff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Shield shape -->
  <path d="M16 4 L26 8 L26 17 C26 22.5 21.5 27 16 29 C10.5 27 6 22.5 6 17 L6 8 Z"
        fill="#010409" stroke="#00f5ff" stroke-width="1.2"
        filter="url(#glow)"/>
  
  <!-- Shield inner fill -->
  <path d="M16 6 L24.5 9.5 L24.5 17 C24.5 21.8 20.8 25.8 16 27.5 C11.2 25.8 7.5 21.8 7.5 17 L7.5 9.5 Z"
        fill="rgba(0,245,255,0.06)"/>
  
  <!-- Lock body -->
  <rect x="12.5" y="16" width="7" height="5.5" rx="1" fill="#00f5ff" opacity="0.9"/>
  
  <!-- Lock shackle -->
  <path d="M13.5 16 L13.5 13.5 C13.5 11.6 18.5 11.6 18.5 13.5 L18.5 16"
        fill="none" stroke="#00f5ff" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Lock keyhole -->
  <circle cx="16" cy="18.5" r="1" fill="#010409"/>
  <rect x="15.4" y="18.5" width="1.2" height="1.8" rx="0.3" fill="#010409"/>
  
  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
